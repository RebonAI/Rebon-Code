# Tactical fork of ratatui 0.29.0 with two local extensions:
# `Terminal::set_viewport_height` (the API from upstream PR #1964, not yet
# released) and cell-level hyperlink metadata emitted by the Crossterm backend.
# The inline TUI runner uses the viewport method to grow/shrink the inline
# viewport during streaming so live content isn't cropped from the top; cell
# metadata keeps OSC-8 bytes out of symbol width and buffer diff calculations.
# Drop this patch and remove `vendor/ratatui-0.29.0-rebon/` once upstream
# ships equivalent APIs in a tagged release.
[patch.crates-io]
ratatui = { path = "vendor/ratatui-0.29.0-rebon" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 0
strip = "symbols"
