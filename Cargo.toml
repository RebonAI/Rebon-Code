# `rebon-rc-runner` dev-depends on the server by path, and cargo pulls a
# member's path dependencies into the workspace. `services/rc-server` is its own
# workspace, so it has to stay out of this one.
exclude = ["services/rc-server"]

[workspace.package]
version = "1.5.3"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
publish = false

[workspace.dependencies]
# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
regex = "1"
boa_engine = "0.19.1"
boa_gc = "0.19.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
socket2 = "0.6"
async-trait = "0.1"

# HTTP / streaming / WebSocket
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy", "gzip", "brotli", "deflate", "zstd"] }
url = "2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# OAuth / PKCE crypto
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
webbrowser = "1"

# Unicode terminal text layout
unicode-width = "0.1"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.12", default-features = false }

# Offline terminal math rendering
ratex-parser = "=0.1.13"
ratex-layout = "=0.1.13"
ratex-types = "=0.1.13"
ratex-svg = { version = "=0.1.13", default-features = false }
ratex-katex-fonts = "=0.1.13"
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }

# Terminal image protocols plus the portable Unicode half-block fallback.
ratatui-image = { version = "=3.0.0", default-features = false, features = ["crossterm"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# Date/time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Filesystem change notification
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }

# Advisory cross-process file locks
fs2 = "0.4"

# Internal crates
rebon-tools-core = { path = "crates/rebon-tools-core" }
rebon-types = { path = "crates/rebon-types" }
rebon-width = { path = "crates/rebon-width" }
rebon-math = { path = "crates/rebon-math" }
rebon-kernel = { path = "crates/rebon-kernel" }
rebon-plugin-protocol = { path = "crates/rebon-plugin-protocol" }
rebon-acp = { path = "crates/rebon-acp" }
rebon-acp-client = { path = "crates/rebon-acp-client" }
rebon-proto = { path = "crates/rebon-proto" }
