[package]
name = "rebon-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Direction-agnostic Agent Client Protocol wire layer for rebon — framing, stdio transport, and JSON-RPC 2.0 + ACP data types shared by the server and client sides."

[dependencies]
rebon-types.workspace = true

thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
schemars = { workspace = true, optional = true }

[features]
# Off by default — see the same feature on `rebon-types`.
schema = ["dep:schemars", "rebon-types/schema"]
