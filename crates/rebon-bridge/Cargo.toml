[package]
name = "rebon-bridge"
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
publish = false
description = "Remote-control bridge primitives and runtime wiring for Rebon sessions. Includes pure-logic protocol helpers with no I/O or rebon-* dependencies, plus async client/runtime traits for session control, permission responses, active handles, and security-sensitive session-id compatibility markers."

[dependencies]
# Data + async runtime needed by the api_client / runtime / http_client
# modules. Versions are explicit rather than `workspace = true`: this
# crate is separable and must still resolve when lifted
# out of the rebon tree. They match the enclosing workspace's versions,
# so being a member of it costs no duplicate builds.
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

# The `http` transport only. `default-features = false` + `rustls-tls`
# deliberately: a second TLS stack would drag OpenSSL onto Windows, and
# the enclosing rebon workspace already standardises on rustls.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# The `ws` transport only. rustls for the same reason as above, and the
# version matches the enclosing workspace's pin so being a member of it
# costs no second tungstenite build.
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }

[features]
default = []
# The concrete `HttpBridgeApiClient`. Off by default so `rebon-core`
# and `rebon-cli`, which only need the trait and the pure types, do not
# pull `reqwest` into their dependency graph.
http = ["dep:reqwest"]
# The session-stream WebSocket client. Separate from `http` and off by
# default for the same reason: the frame envelope in `session_stream` is
# what most consumers need, and it costs nothing.
ws = ["dep:tokio-tungstenite", "dep:futures-util"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }
