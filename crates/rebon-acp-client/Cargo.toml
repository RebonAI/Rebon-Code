[package]
name = "rebon-acp-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Agent Client Protocol client for rebon — spawn a third-party agent CLI, drive its sessions, and serve the reverse fs/permission requests it makes back."

[dependencies]
rebon-proto.workspace = true
rebon-agent-core.workspace = true
rebon-session.workspace = true
rebon-tools-core.workspace = true
rebon-types.workspace = true

anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Only the liveness probe needs these now; the job-object guard moved to
# rebon-tools-core.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
