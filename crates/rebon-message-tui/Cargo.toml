[package]
name = "rebon-message-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The ratatui half of the message stack: turns the projections rebon-render produces into ratatui Text, Lines and widget subtrees for chat message rows. Everything that is not a terminal concern lives in rebon-render, which this crate depends on and never the other way round."

[dependencies]
# The projection this crate paints. The direction is one-way on purpose: a
# projection that needed a terminal type would stop being usable by
# non-terminal front-ends.
rebon-render = { workspace = true }
# ratatui, resolved through the workspace's [patch.crates-io] to the vendored
# 0.29.0 fork in `vendor/ratatui-0.29.0-rebon`.
ratatui = { version = "0.29", default-features = false }
# Markdown token walking. Deliberately on this side of the split -- picking a
# parser is a rendering decision, and rebon-render's streaming boundary takes
# its lexer as an injected callback so it stays parser-agnostic.
pulldown-cmark = { workspace = true }
# Grapheme walking for cell layout.
unicode-segmentation = { workspace = true }
# The workspace's one display-width policy, so laid-out and painted widths agree.
rebon-width = { workspace = true }
# Theme colors.
rebon-design-system = { workspace = true }
# Shell output formatting for tool-result body widgets.
rebon-shell = { workspace = true }
# Offline formula rendering (RaTeX -> SVG -> RGBA). A leaf on purpose: it
# drags resvg / usvg / tiny-skia / rustybuzz and the embedded KaTeX fonts.
rebon-math = { workspace = true }

[dev-dependencies]
