[package]
name = "rebon-plugin-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The binary half of the `node:rebon-browser` plugin: the `rebon-browser-mcp` executable that plugin's manifest spawns. A local Chrome/Edge extension bridge and stdio MCP server, with no `PluginDef` of its own."

[[bin]]
name = "rebon-browser-mcp"
path = "src/bin/rebon-browser-mcp.rs"

[dependencies]
# The pairing token file is published through the shared atomic write.
rebon-session.workspace = true
rebon-types.workspace = true
anyhow.workspace = true
base64.workspace = true
# For `[[bin]] rebon-browser-mcp`: argument parsing and a stderr-only subscriber.
clap.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"
