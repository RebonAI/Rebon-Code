[package]
name = "rebon-plugin-computer-use"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The `computer-use` feature plugin: the ComputerUse tool, its provider-capability cell, and the native desktop runtime the tool drives."

# The plugin's binary half: `serve` lends the process's main thread to the
# platform and starts no kernel, so it cannot be a seat.
[[bin]]
name = "rebon-computer-use"
path = "src/bin/rebon-computer-use.rs"

[dependencies]
rebon-kernel.workspace = true
rebon-core.workspace = true
rebon-tool.workspace = true
rebon-tools-core.workspace = true
# The model-facing projection this tool builds itself: a summary line beside
# a real image block, in the same wire types the engine hands the provider.
rebon-api.workspace = true
# For the one shared config-home resolution. Depending on it beats keeping a
# fourth copy of that logic here: the runtime's copy was the one that read only
# `REBON_CONFIG_HOME`, so the endpoint file stayed on the profile drive when
# everything else had moved.
rebon-session.workspace = true
rebon-types.workspace = true

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
# For `[[bin]] rebon-computer-use`: argument parsing, and a subscriber that
# keeps log lines out of the report this command prints on stdout.
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan", "highsierra"] }
foreign-types = "0.5"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# `env_test_lock`: the process-wide lock every test that swaps an environment
# variable takes, shared with `rebon-tool`'s own tests.
rebon-tool = { workspace = true, features = ["test-support"] }
