[package]
name = "rebon-plugin-lsp-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The binary half of the `rust-lsp` plugin identity: the `rebon-lsp-mcp` executable that `--lsp rust` and the `rust-lsp` builtin alias configure as an MCP server. A minimal Rust LSP-to-MCP bridge, with no `PluginDef` of its own."

[[bin]]
name = "rebon-lsp-mcp"
path = "src/bin/rebon-lsp-mcp.rs"

[dependencies]
# Config-home resolution for the daemon directory, and the atomic write
# that publishes daemon.json.
rebon-session.workspace = true
rebon-tools-core.workspace = true
rebon-types.workspace = true
anyhow.workspace = true
async-trait.workspace = true
# For `[[bin]] rebon-lsp-mcp`: argument parsing and a stderr-only subscriber.
clap.workspace = true
tracing-subscriber.workspace = true
fs2.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
