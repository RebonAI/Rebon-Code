[package]
name = "rebon-plugin-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The `updater` feature plugin: everything Rebon knows about its own updates. Release channels, installation-source detection, package-manager commands, semver comparison, the max-version gate, the update state machine and the per-user scheduler registration, plus the npm registry check, the `/update` command and the `rebon update` subcommand bodies."

[dependencies]
# The command seat `/update` registers on, and the parser helper the slash
# grammar shares with every other command.
rebon-config-seat.workspace = true
rebon-command-seat.workspace = true
rebon-kernel.workspace = true
rebon-slash-commands.workspace = true

# Update preferences live in the settings file, not here: this crate reads and
# writes `UpdatePreferences` and never re-decides where the config home is.
rebon-config.workspace = true

anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Keep the dependency floor low so the pure-logic half stays lightweight.
tempfile = "3"
