[package]
name = "rebon-plugin-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The `remote` feature plugin: running Rebon against a project on another machine. ssh argv and connection multiplexing, the `remotes.json` store, remote platform detection and the server install scripts, the `DeclaredAgent` a host is exposed as under `remote:<name>`, and the `rebon remote …` subcommand bodies."

[dependencies]
# A host declares itself as an agent CLI; the seat below it is how the
# terminal collects those declarations without depending on this crate.
rebon-agent-core.workspace = true
rebon-kernel.workspace = true

rebon-config = { workspace = true }
# remotes.json is published through the shared atomic write.
rebon-session = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# A temporary `REBON_CONFIG_DIR` for the tests that write `remotes.json`.
tempfile = "3"
