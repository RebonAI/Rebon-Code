[package]
name = "rebon-plugin-image-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The `image-gen` feature plugin: the ImageGen tool that calls the OpenAI Images API with the session provider's credentials, its provider-endpoint cell, and the `imagegen` skill it ships on the skill-bundles seat."

[dependencies]
rebon-kernel.workspace = true
rebon-core.workspace = true
rebon-tool.workspace = true
rebon-tools-core.workspace = true
# The model-facing projection (an image block beside a summary line) and the
# OAuth `TokenRefresher` the provider's own client already rotates tokens with.
rebon-api.workspace = true
# `generated_images_output_base`: where generated images land is a config fact
# (`generatedImagesDir`), not this plugin's to decide.
rebon-config.workspace = true

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
