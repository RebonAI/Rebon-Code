[package]
name = "rebon-plugin-plan-mode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The `plan-mode` feature plugin: the plan-mode tool pair (EnterPlanMode, ExitPlanMode), the /ultraplan requirement ledger (PlanLedger), and the three plan-mode attachments the model reads between tool rounds. The session record those attachments read from — the permission mode and the transition flags — stays in rebon-session-state, because the TUI's mode cycle writes it without going through a tool."

