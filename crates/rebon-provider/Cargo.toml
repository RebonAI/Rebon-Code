[package]
name = "rebon-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Model providers: the catalog of everything Rebon can reach, the per-provider runtime cache, the `model-router` kernel seat, and the two faces of a provider that a plugin supplies (its manifest contribution and its `llm/stream` adapter on the plugin host)."

[dependencies]
# The `model-router` seat and the plugin the kernel loads for it.
rebon-kernel.workspace = true
# `ProviderRuntimeResolver` / `ProviderModelRuntime`: the routing contract the
# agents and workflow plugins ask, defined below the plugin layer (C1c).
rebon-agent-core.workspace = true
# `ModelClient`, `CreateMessageRequest`, `StreamEvent` — the model contract the
# dsh chunk protocol is translated into and out of.
rebon-api.workspace = true
# Provider entries, formats and the settings chain the catalog reads.
rebon-config.workspace = true
# `ModelProfileMap` and the provider ids the catalog projects.
rebon-types.workspace = true
# A package's declared `modelProviders`, as data.
rebon-plugin-package.workspace = true
# The wire types a plane-hosted provider speaks (`CreateMessageRequestV1`).
rebon-plugin-protocol.workspace = true
# The shared plugin host a plane-hosted provider and an llm adapter run on.
rebon-plugin-supervisor.workspace = true
# `ModelUsage` / tool definitions carried through the dispatch translation.
rebon-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
