[workspace]

[package]
name = "rebon-rc-server"
version = "0.1.0"
edition = "2021"
license = "FSL-1.1-ALv2"
rust-version = "1.80"
publish = false
description = "Rebon Remote Control service — accounts, environments, work queue, leases and the session stream."

[dependencies]
axum = { version = "0.8", features = ["ws", "json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
hmac = "0.12"
http = "1"
rand = "0.8"
rebon-bridge = { path = "../../crates/rebon-bridge" }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
# The real clients, driven against this server: the HTTP client in
# `tests/bridge_client.rs` and the session-stream client in
# `tests/session_stream.rs`. Enabling `http` and `ws` here is also what
# keeps both features compiled in CI.
rebon-bridge = { path = "../../crates/rebon-bridge", features = ["http", "ws"] }
# rustls, like the client: two TLS stacks in one test binary would be a
# pointless second dependency tree (and OpenSSL on Windows).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
