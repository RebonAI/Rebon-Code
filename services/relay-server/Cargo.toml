[workspace]

[package]
name = "rebon-relay-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
fs2 = "0.4"
hmac = "0.12"
http = "1"
rand = "0.8"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.26"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
